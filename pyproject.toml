[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "delivery-robot-feasibility"
version = "0.1.0"
description = "Scores Somerville, MA street segments for autonomous delivery-robot feasibility using Cyvl data, LiDAR, and open data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "geopandas>=0.14",
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.31",
    "laspy[lazrs]>=2.5",
    "scipy>=1.11",
]

[project.scripts]
run-pipeline = "pipeline.cli:main"

[tool.setuptools]
packages = ["pipeline"]
